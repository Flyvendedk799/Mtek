# Camera: position (0, 0, 10) looking at the origin, fov_y 0.9, 128 x 128 target: in the plane z = 0 one world unit
# is 13.25 pixels, the origin is at pixel (64, 64), +X right, +Y up. Everything moves in that plane. With a = 0.8 t
# and b = 2.5 t the Planet is at (3 cos a, 3 sin a) and the Moon at the Planet's position plus (cos b, sin b),
# counter-clockwise as seen. Expected pixels come from an independent CPU ray caster (f64) of the spheres at those
# positions (every probe is at least 2 pixels inside a sphere, or 3 pixels outside, here in the background where
# the Planet and the Moon would be if the planet turned clockwise). The same times are reached with frames of
# 1/60 s and of 1/30 s: the motion follows the frame time.
name = "Planet and Moon orbit counter-clockwise at 0.8 and 2.5 rad/s (frames of 1/60 s)"
