# Orthographic camera at (0, 0, 10), visible height 8 on a 128 pixel target: 16 pixels per world unit, the
# origin at pixel (64, 64), +Y up. The Fill box (1.6 wide, 1 high) is scaled along y by 1 + 4 * level around
# its centre, so its height is h = 1 + 4 * level and it reaches 8 h pixels either side of row 64; the Frame behind
# it is 2.2 wide and 5.6 high (35 by 90 pixels). The level starts at 0.5 and each key press changes it by 0.25
# within 0 to 1. Probes (independent CPU ray caster, f64): inside the fill 3 pixels from its top and bottom edge,
# outside it 3 pixels beyond them (frame or background, skipped when closer than 1 pixel to an edge), and
# across at x = 74 (fill), 79 (frame) and 84 (background). A key press is applied at the start of the next
# frame, so a step follows each press.
