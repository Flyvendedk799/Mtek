# Perspective camera at (0, 5, 10) looking at the origin, fov_y 0.9, 128 x 128 target. The floor is the 8 x 8
# square of the x-z plane at y = 0 (seen from above); every object is drawn with a depth test, so what is
# nearer to the camera wins whatever the declaration order. The expected pixels come from an independent
# CPU ray caster (f64) of exactly the described scene, not from any renderer; each probe is at least 1 pixel
# away from a silhouette or an intersection curve (2 to 3 pixels near the sphere). They tell apart: a floor
# that is missing, facing down or of the wrong size, a hidden box that is drawn, objects drawn in
# declaration order instead of by depth.
