  { expect_pixel = { x = 7, y = 45, color = "#facc15", tolerance = 2 } },
  { expect_pixel = { x = 45, y = 45, color = "#111827", tolerance = 2 } },
  { expect_pixel = { x = 82, y = 45, color = "#111827", tolerance = 2 } },
  { expect_pixel = { x = 121, y = 45, color = "#111827", tolerance = 2 } },
  { expect_pixel = { x = 10, y = 64, color = "#475569", tolerance = 2 } },
  { expect_pixel = { x = 43, y = 64, color = "#475569", tolerance = 2 } },
  { expect_pixel = { x = 84, y = 64, color = "#475569", tolerance = 2 } },
  { expect_pixel = { x = 117, y = 64, color = "#475569", tolerance = 2 } },
]
