# slots 0 to 3, the slot centres at (10, 64), (43, 64), (84, 64), (117, 64).
# Every block below lists the cursor pixel of every slot (yellow where the cursor is, background where it is
# not) and the slot pixels (never changed). A key press is applied at the start of the next frame, so a step
