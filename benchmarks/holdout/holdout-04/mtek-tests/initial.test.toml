# Perspective camera at (0, 0, 7) looking at the origin, fov_y 0.9, 128 x 128 target. The slots are boxes of
# edge 1.2 at x = -3, -1, 1, 3 (y = 0); the cursor is a sphere of radius 0.3 at height 1.0 above the chosen slot.
