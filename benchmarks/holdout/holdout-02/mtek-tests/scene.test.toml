# from the task text (the parent's transform T . R . S applies to its children):
#   Arm    local x scaled by 2, then turned 90 degrees: world x 0.5 .. 1.5, y -2 .. 0
#   Hand   centre (1, 1); its own 0.5 box is stretched by the parent: world width 0.5 (x), height 1.0 (y)
