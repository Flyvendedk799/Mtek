# The turns add up, 30 degrees per press (CPU projection, see 00-initial.test.toml). The barrel is at world
# (2.2 sin a, 0, 2.2 cos a) for the heading a:
#   three presses, a =  90: (2.2, 0, 0)       pixel (100.4, 64): straight to the right, 6.5 pixels inside
#   four presses,  a = 120: (1.905, 0, -1.1)  pixel (91.7, 64):  to the right and behind the turret's centre
#   six presses,   a = 180: (0, 0, -2.2)      pixel (64, 64):    directly behind the turret, hidden by it
# The turret is a cube, so after 90 and 180 degrees it looks as it did at 0; its purple face is sampled at
# (55, 64) and (64, 64). The mirror image of the first position (x = -2.2) is pixel 28, background.
