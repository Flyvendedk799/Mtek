# One press turns the turret by 30 degrees to the right: a positive angle about +Y turns the +Z direction toward
# +X, so the barrel (local (0, 0, 2.2)) is at world (2.2 sin 30, 0, 2.2 cos 30) = (1.1, 0, 1.905), pixel
# (87.9, 64) (CPU projection, see 00-initial.test.toml). Its silhouette is 9 pixels inside at (86, 64); a turn
# to the left (x = -1.1) would put it at pixel 40, covering (36, 64), which is background in the intended
# scene. The key press is applied at the start of the next frame.
name = "one press of Space turns the turret 30 degrees to the right"
steps = [
  { step = 2, dt = 0.016666668 },
  { press = "Space" },
  { step = 1, dt = 0.016666668 },
  { release = "Space" },
  { step = 1, dt = 0.016666668 },
  { expect_pixel = { x = 86, y = 64, color = "#f59e0b", tolerance = 2 } },
  { expect_pixel = { x = 55, y = 64, color = "#6b5cff", tolerance = 2 } },
  { expect_pixel = { x = 64, y = 64, color = "#6b5cff", tolerance = 2 } },
  { expect_pixel = { x = 36, y = 64, color = "#202020", tolerance = 2 } },
  { expect_pixel = { x = 110, y = 64, color = "#202020", tolerance = 2 } },
  { expect_pixel = { x = 20, y = 64, color = "#202020", tolerance = 2 } },
  { expect_pixel = { x = 64, y = 30, color = "#202020", tolerance = 2 } },
  { expect_pixel = { x = 64, y = 100, color = "#202020", tolerance = 2 } },
]
