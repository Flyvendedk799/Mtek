# The host page sets the brightness through the input named brightness (the old name no longer exists; this
# fixture only uses the new one). Bulb silhouette (CPU projection, see 00-initial.test.toml), in pixels in x
# and y:
#   brightness 0.0: 54.4 to 73.6    0.25: 49.6 to 78.4    1.0: 35.2 to 92.8
# A host input is applied at the start of the next frame, hence a `step` after every `set_input`.
name = "the host input brightness sets the lamp"
steps = [
  { step = 2, dt = 0.016666668 },

  { set_input = { brightness = 0.0 } },
  { step = 1, dt = 0.016666668 },
  { expect_pixel = { x = 64, y = 64, color = "#fde047", tolerance = 2 } },
  { expect_pixel = { x = 60, y = 64, color = "#fde047", tolerance = 2 } },
  { expect_pixel = { x = 50, y = 64, color = "#4b5563", tolerance = 2 } },
  { expect_pixel = { x = 78, y = 64, color = "#4b5563", tolerance = 2 } },

  { set_input = { brightness = 1.0 } },
  { step = 1, dt = 0.016666668 },
  { expect_pixel = { x = 44, y = 64, color = "#fde047", tolerance = 2 } },
  { expect_pixel = { x = 84, y = 64, color = "#fde047", tolerance = 2 } },
  { expect_pixel = { x = 30, y = 64, color = "#4b5563", tolerance = 2 } },
  { expect_pixel = { x = 98, y = 64, color = "#4b5563", tolerance = 2 } },

  { set_input = { brightness = 0.25 } },
  { step = 1, dt = 0.016666668 },
  { expect_pixel = { x = 56, y = 64, color = "#fde047", tolerance = 2 } },
  { expect_pixel = { x = 72, y = 64, color = "#fde047", tolerance = 2 } },
  { expect_pixel = { x = 44, y = 64, color = "#4b5563", tolerance = 2 } },
  { expect_pixel = { x = 84, y = 64, color = "#4b5563", tolerance = 2 } },

  # the keys write the same value the host sets: D after the host input, then Space
  { press = "KeyD" },
  { step = 1, dt = 0.016666668 },
  { release = "KeyD" },
  { step = 1, dt = 0.016666668 },
  { expect_pixel = { x = 50, y = 64, color = "#4b5563", tolerance = 2 } },
  { expect_pixel = { x = 60, y = 64, color = "#fde047", tolerance = 2 } },
  { press = "Space" },
  { step = 1, dt = 0.016666668 },
  { release = "Space" },
  { step = 1, dt = 0.016666668 },
  { expect_pixel = { x = 44, y = 64, color = "#fde047", tolerance = 2 } },
  { expect_pixel = { x = 30, y = 64, color = "#4b5563", tolerance = 2 } },
]
