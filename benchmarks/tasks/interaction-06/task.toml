id = "interaction-06"
category = "interaction"
mode = "edit"
title = "Keys that change a counter: double, add three, reset, with a cap"
prompt = """The scene Demo is drawn from the front with a flat (orthographic) camera. A horizontal bar named Bar shows a whole-number counter called value: the bar is value world units long and its left end always stays at the same place. The counter starts at 1, the scene already draws the bar from it, and no key changes the counter yet.
Make these keys change value:
- A press of D doubles it.
- A press of P adds 3 to it.
- A press of R sets it back to 1.
- value never exceeds 8: any result above 8 becomes 8.
Every key press counts and is applied in the order the presses were made, also when several keys are pressed at the same moment (in the same frame). For example, starting from 1, D then P gives (1 x 2) + 3 = 5, while P then D gives (1 + 3) x 2 = 8. Without any key press nothing changes. The bar's drawing, the camera and everything else stay as they are."""
required_symbols = ["Demo.Bar", "Demo.value"]
mtek_side_status = "unverified-until-M6"

[budgets]
max_repairs = 3
max_output_tokens = 4000
max_wall_seconds = 300
