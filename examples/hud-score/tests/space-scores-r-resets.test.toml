# The HUD itself is not observable from a fixture (it is DOM over the canvas; TESTING-codey2.md has the manual
# check); this fixture checks the state that the keys drive and that `update`, which draws the HUD every frame,
# runs without a runtime error. Each press is applied at the start of the next frame.
name = "Space scores and R resets; the round clock runs"
steps = [
  { step = 2, dt = 0.016666668 },
  { expect_state = { points = 0, best = 0 } },

  { press = "Space" },
  { step = 1, dt = 0.016666668 },
  { release = "Space" },
  { press = "Space" },
  { step = 1, dt = 0.016666668 },
  { release = "Space" },
  { expect_state = { points = 2, best = 2, elapsed = { value = 0.0667, tolerance = 0.002 } } },

  { press = "KeyR" },
  { step = 1, dt = 0.016666668 },
  { release = "KeyR" },
  { expect_state = { points = 0, best = 2 } },
]
