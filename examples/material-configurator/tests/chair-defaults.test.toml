# The chair before the host sets anything: the state the program starts in, how it is drawn, and the picture.
#
# State: the factors of the GLB's own materials and the literals of src/main.mtek. "Fabric" is the colour
# (0.55, 0.12, 0.10) in linear light, metallic 0, roughness 0.85; "Steel" is (0.80, 0.80, 0.82), metallic 1, roughness 0.30;
# the stripes are #e8e2d0 and #2a3f5f, the back's roughness 0.6 and the sun's intensity 3.
#
# Counters (spec/runtime-abi.md section 8.4, decision 0059): 12 entities are alive, the 10 drawn ones plus the two lights
# (Sun, Lamp). The four legs share one mesh, one pipeline and one constant "Oak" parameter block, so they are one instanced
# draw; the other six drawn entities are single draws: 7 draw calls. Five entities own their parameter block (the floor, the
# seat, the back and the two rails), the Oak block of the legs and the crest is the one shared block. Pipelines: Pbr, the
# custom Striped material and the instanced variant of Pbr; shader modules: the two materials. Nothing is culled.
#
# Pixels (128 x 128, camera at (0, 1.15, 2.6) looking at (0, 0.45, 0), fov_y 0.8, clear colour #1b1f27). Each one is picked
# where a 1 px wide footprint sees one surface of one entity (a CPU ray tracer over the geometry of chair.glb finds them,
# tests/browser/support/configurator-scene.ts) and its colour is that tracer's shading with the documented PBR model
# (spec/materials.md section 8: Sun, Lamp and ambient 0.12), not read from the GPU; lit colours carry the 3/255 tolerance of
# spec/testing.md section 6.3. tests/browser/support/mtek-test/example-fixtures.test.ts recomputes every one of them.
