<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material Configurator</title>
<!--
  A host page for the build in ../dist (run `mtek build` first). The program is the module `../dist/app.js`; the page only
  mounts it on a canvas and forwards its controls to `app.setInput(name, value)`. The names are the keys of
  mtek.toml [host.inputs]; a colour is the string "#rrggbb" (sRGB, converted like a colour literal), a number is a plain number.
  `setInput` never throws: it returns `{ ok: false, error }` for an unknown name or a value of the wrong type.

  Tests and embedders can set `window.mtekHostOptions` (the `options` of `mountMtek`) before this module runs; the mounted
  application is left in `window.mtekApp`.
-->
<style>
  :root { color-scheme: dark; font: 14px/1.4 system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; background: #1b1f27; color: #dde3ee; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 18rem; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
  form { padding: 1rem; overflow-y: auto; background: #12151b; }
  fieldset { border: 1px solid #2c3340; border-radius: 6px; margin: 0 0 1rem; padding: .5rem .75rem .75rem; }
  legend { padding: 0 .4rem; color: #9fb0cc; }
  label { display: grid; grid-template-columns: 6.5rem 1fr; align-items: center; gap: .5rem; margin-top: .4rem; }
  input[type="color"] { width: 100%; height: 1.8rem; padding: 0; border: 0; background: none; }
  input[type="range"] { width: 100%; }
  #status { min-height: 1.4em; color: #f08a8a; }
  @media (max-width: 40rem) { main { grid-template-columns: 1fr; grid-template-rows: 60% 40%; } }
</style>
<main>
  <canvas id="mtek"></canvas>
  <form id="controls" autocomplete="off">
    <fieldset>
      <legend>Seat</legend>
      <label>Colour <input type="color" data-input="seat_color" value="#c46159"></label>
      <label>Metallic <input type="range" data-input="seat_metallic" min="0" max="1" step="0.05" value="0"></label>
      <label>Roughness <input type="range" data-input="seat_roughness" min="0" max="1" step="0.05" value="0.85"></label>
    </fieldset>
    <fieldset>
      <legend>Rails</legend>
      <label>Colour <input type="color" data-input="frame_color" value="#e7e7ea"></label>
      <label>Metallic <input type="range" data-input="frame_metallic" min="0" max="1" step="0.05" value="1"></label>
      <label>Roughness <input type="range" data-input="frame_roughness" min="0" max="1" step="0.05" value="0.3"></label>
    </fieldset>
    <fieldset>
      <legend>Back (stripes)</legend>
      <label>Stripe A <input type="color" data-input="stripe_a" value="#e8e2d0"></label>
      <label>Stripe B <input type="color" data-input="stripe_b" value="#2a3f5f"></label>
      <label>Roughness <input type="range" data-input="back_roughness" min="0" max="1" step="0.05" value="0.6"></label>
    </fieldset>
    <fieldset>
      <legend>Light</legend>
      <label>Sun <input type="range" data-input="sun_intensity" min="0" max="10" step="0.25" value="3"></label>
    </fieldset>
    <p id="status" role="status"></p>
  </form>
</main>
<script type="module">
  import program, { mountMtek } from "../dist/app.js";

  const status = document.getElementById("status");
  const app = await mountMtek(document.getElementById("mtek"), program, window.mtekHostOptions ?? {});
  window.mtekApp = app;

  // A control's value is what setInput takes: colour inputs give "#rrggbb", range inputs a number.
  function valueOf(control) {
    return control.type === "range" ? Number(control.value) : control.value;
  }

  function send(control) {
    const result = app.setInput(control.dataset.input, valueOf(control));
    status.textContent = result.ok ? "" : `${control.dataset.input}: ${result.error.message}`;
  }

  const controls = document.querySelectorAll("[data-input]");
  for (const control of controls) control.addEventListener("input", () => send(control));
  // Apply what the controls show, so the picture and the controls agree from the first frame (the page may have restored them).
  for (const control of controls) send(control);
</script>
