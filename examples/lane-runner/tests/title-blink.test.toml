# The title scene by itself: the prompt blinks on a timer of the game clock, and the logo turns.
#
# Every frame is 0.125 s (exact in binary floating point). `update` of the first frame starts
# `every(0.5) { prompt = !prompt; }` after the timers of that frame ran, at game time 0.125, so it is
# first due at 0.625: in frame 5. It is then due every 0.5 s: frames 9, 13, ...
# The logo turns by 0.8 * dt per frame: 0.4 rad after 4 frames.
name = "the title prompt blinks every half second of game time"
steps = [
  { step = 4, dt = 0.125 },
  { expect_state = { started = true, prompt = true, spin = { value = 0.4, tolerance = 1e-5 } } },
  { step = 1, dt = 0.125 },
  { expect_state = { prompt = false } },
  { step = 3, dt = 0.125 },
  { expect_state = { prompt = false } },
  { step = 1, dt = 0.125 },
  { expect_state = { prompt = true } },
]
