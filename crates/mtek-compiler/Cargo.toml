[package]
name = "mtek-compiler"
description = "The Mtek compiler library: source text to build output."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha2 = "=0.11.0"
libm = "=0.2.16"
naga = { version = "=30.0.1", default-features = false, features = ["wgsl-in"] }
toml = { version = "=1.1.6", default-features = false, features = ["std", "parse"] }

[dev-dependencies]
jsonschema = { version = "=0.58.5", default-features = false }

[lints]
workspace = true

# The generator's own unit tests (shader text, leaf list) run with `cargo test`.
[[example]]
name = "bridge_spike"
test = true
