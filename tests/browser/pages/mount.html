<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mtek mount fixture</title>
    <style>
      html,
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <script type="module">
      // The runtime bundle exactly as `npm run build -w @mtek/runtime-web` produces it, and the compiler's
      // golden app.js of codegen fixture A (copied next to the minimal manifest by global setup), whose
      // generated writers and init fit the manifest's layouts and its one box entity. Its scene is renamed
      // to the manifest's entry scene `Demo`.
      //  - `program` hides the box after init, so the M1-14 specs see the clear colour only;
      //  - `drawingProgram` draws it (M1-18).
      import { mountMtek, MtekMountError } from "/mount/runtime.js";
      import golden from "/mount/fixture/app.js";
      const scene = Object.values(golden.scenes)[0];
      const withInit = (init) => ({ ...golden, scenes: { Demo: { ...scene, init } } });
      window.__mtek = {
        mountMtek,
        MtekMountError,
        program: withInit((ctx) => {
          scene.init(ctx);
          ctx.setVisible(ctx.e[0], false);
        }),
        drawingProgram: withInit(scene.init),
      };
    </script>
  </body>
</html>
