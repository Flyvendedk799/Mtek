[package]
name = "mtek-grammar-adapters"
description = "The pinned grammar-constrained decoding backend (llama.cpp GBNF): capability check, validator runner and adapter conformance suite (decision 0073)."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "grammar-adapter"
path = "src/main.rs"

# The conformance suite and the generation smoke (spec/ai-and-benchmarks.md section 3 names
# tools/grammar-adapters/test/). Without the pinned validator or model they report NOT-RUN.
# `harness = false`: they print their own report (counts, or NOT-RUN with the reason), which
# `cargo test` shows whether they pass or not.
[[test]]
name = "conformance"
path = "test/conformance.rs"
harness = false

[[test]]
name = "smoke"
path = "test/smoke.rs"
harness = false

[dependencies]
mtek-compiler = { path = "../../crates/mtek-compiler" }
# Already in the workspace (decision 0007): pins.json, install.json and the check report.
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
# Already in the workspace (decision 0007): verifying the pinned model file.
sha2 = "=0.11.0"

[lints]
workspace = true
