name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml (channel, rustfmt, clippy).
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  node:
    name: node (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm run build` also builds the CLI with cargo, so the pinned Rust toolchain is needed here too.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Type-check
        run: npm run check:ts
      - name: Lint
        run: npm run lint
      - name: Naming check
        run: npm run check:naming
      - name: Unit tests
        run: npm run test:unit
