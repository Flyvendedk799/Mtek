name: CI

on:
  push:
  pull_request:
  # Manual runs only: the frame-evidence job below needs self-hosted GPU runners (decision 0137).
  workflow_dispatch:
    inputs:
      frame_evidence:
        description: "Record frame-time evidence on the self-hosted GPU runners (NVIDIA, Intel, Apple)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml (channel, rustfmt, clippy).
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Builds `mtek` without an embedded runtime (build.rs), so the `#[cfg(not(mtek_runtime_embedded))]`
      # tests run: `mtek build` reports E9030, and the dev server and `mtek test` refuse in the same way.
      - name: CLI tests without the embedded runtime (E9030)
        run: cargo test -p mtek-cli --locked
        env:
          MTEK_NO_EMBEDDED_RUNTIME: "1"
      # The Mtek sources of the repository are canonical (decision 0070): the `Test` step runs
      # `mtek fmt --check` over the examples, the templates and the benchmark sources
      # (crates/mtek-cli/tests/fmt.rs), which lists the files `mtek fmt` would change.

  node:
    name: node (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm run build` also builds the CLI with cargo, so the pinned Rust toolchain is needed here too.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # The CLI always embeds a runtime (the checked-in prebuilt copy, or `dist/` once built, decision
      # 0131), so its embedded-path tests run in the `rust` job too; this job runs them against the
      # `dist/` that `npm run build` just produced. The `rust` job also runs the tests of the
      # path without a runtime (E9030) with MTEK_NO_EMBEDDED_RUNTIME=1.
      - name: CLI tests with the embedded runtime
        run: cargo test -p mtek-cli --locked
      - name: Type-check
        run: npm run check:ts
      - name: Lint
        run: npm run lint
      - name: Naming check
        run: npm run check:naming
      # The checked-in prebuilt runtime (crates/mtek-cli/prebuilt) is built from today's sources; a
      # runtime change without `npm run prebuilt:write` would ship stale to a fresh clone.
      - name: Prebuilt runtime is current
        run: npm run check:prebuilt
      - name: Benchmark task validation
        run: npm run check:tasks
      - name: Unit tests
        run: npm run test:unit
      # The feature coverage matrix (decision 0093): derived from the programs the build above compiled;
      # fails when a feature has no demonstration or positive fixture, a diagnostic code no negative test,
      # or docs/coverage-matrix.md is stale.
      - name: Coverage matrix
        run: npm run check:coverage
      # The release documentation and the capability consistency check (decisions 0100, 0101, 0104):
      # the generated pages (language guide, language reference, limitations) are current; the
      # compiler's supported features, the registry, the runtime's ABI and capabilities, the
      # specification and the README claims agree, naming both sides of any mismatch; every claim
      # of the release notes draft links to evidence.
      - name: Release documentation and capability consistency
        run: npm run check:release
      # The M7 baseline (decision 0126): evidence/M7/baseline.json and the number tables of
      # evidence/M7/report.md follow from the stored benchmark results.
      - name: M7 baseline
        run: npm run check:baseline

  # Small-game budgets (decision 0137): every example is packaged with `mtek build --release --itch` and
  # its folder and zip sizes are checked against budgets/small-games.json. No GPU is needed.
  game-budgets:
    name: game-budgets (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      # The CLI embeds the prebuilt runtime (decision 0131), including runtime.min.js; no npm build needed.
      - name: Build the CLI
        run: cargo build -p mtek-cli --locked
      - name: Game package unit tests
        run: cargo test -p mtek-cli --locked --bin mtek game_package
      - name: Bundle size budgets
        run: node scripts/game-budgets.mjs size --json game-sizes.json
      - name: Upload the size report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-sizes
          path: game-sizes.json
          if-no-files-found: warn

  # Frame-time evidence on real GPUs (decision 0137). It runs only when started by hand with
  # frame_evidence=true, on self-hosted runners labelled `mtek-gpu` plus the vendor. The runners are Abe's
  # machines; none is registered yet, so this job has never produced evidence. A software adapter is
  # refused by `game-budgets.mjs frames`; it can never pass.
  frame-evidence:
    name: frame-evidence (${{ matrix.gpu }})
    if: github.event_name == 'workflow_dispatch' && inputs.frame_evidence
    runs-on: [self-hosted, mtek-gpu, "${{ matrix.gpu }}"]
    strategy:
      fail-fast: false
      matrix:
        gpu: [nvidia, intel, apple]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Build the CLI
        run: cargo build -p mtek-cli --locked
      - name: Record frame times
        run: node scripts/record-frame-evidence.mjs frame-evidence-${{ matrix.gpu }}.json
      - name: Check the frame budget
        run: node scripts/game-budgets.mjs frames frame-evidence-${{ matrix.gpu }}.json
      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frame-evidence-${{ matrix.gpu }}
          path: frame-evidence-${{ matrix.gpu }}.json
          if-no-files-found: warn

  # Software-adapter browser tests (SwiftShader): correctness only, never hardware evidence. Without
  # a usable adapter the tests are reported NOT-RUN (the job does not fail for that; real test
  # failures still fail it). MTEK_REQUIRE_GPU is deliberately not set here.
  browser-software:
    name: browser-software (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm run test:browser` runs `npm run build`, which builds the CLI with cargo.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # A virtual X display is required for WebGPU canvas presentation on Linux.
      # Offscreen readback alone passes even when headless Chromium composites a blank canvas.
      - name: Browser tests (software project, virtual display)
        run: xvfb-run -a npm run test:browser -- --project=software
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-software-results
          path: tests/browser/results/
          if-no-files-found: warn

  # The VS Code extension (packages/editor-vscode, decision 0090): the generated TextMate grammar is
  # current, the unit tests pass, the extension is packaged as a .vsix (uploaded as a workflow
  # artifact; nothing is published to a marketplace and no secret is used) and its integration
  # suite runs in a real VS Code (downloaded by @vscode/test-electron and pinned by version in
  # scripts/run-vscode-tests.ts) against the real `mtek lsp`. A VS Code that cannot be downloaded
  # or started fails the step (the runner prints NOT-RUN and exits 1); it is never a pass.
  vscode-extension:
    name: vscode-extension (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm run build` also builds the CLI with cargo: the integration suite starts `target/debug/mtek`.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: TextMate grammar is up to date
        run: npm run check:grammar -w mtek-vscode
      - name: Unit tests
        run: npm run test:unit -w mtek-vscode
      - name: Package the .vsix
        run: npm run package -w mtek-vscode
      - name: Upload the .vsix
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: mtek-vscode-vsix
          path: packages/editor-vscode/mtek-vscode-*.vsix
          if-no-files-found: error
      # Electron needs a display: Linux runs under Xvfb.
      - name: Integration tests (VS Code, Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration -w mtek-vscode
      - name: Integration tests (VS Code, Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration -w mtek-vscode
