name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml (channel, rustfmt, clippy).
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  node:
    name: node (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm run build` also builds the CLI with cargo, so the pinned Rust toolchain is needed here too.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # `npm run build` produced packages/runtime-web/dist, so the CLI is rebuilt with the runtime
      # embedded (cfg `mtek_runtime_embedded`) and its embedded-path tests run here; the `rust` job
      # covers the path without the bundle (E9030).
      - name: CLI tests with the embedded runtime
        run: cargo test -p mtek-cli --locked
      - name: Type-check
        run: npm run check:ts
      - name: Lint
        run: npm run lint
      - name: Naming check
        run: npm run check:naming
      - name: Benchmark task validation
        run: npm run check:tasks
      - name: Unit tests
        run: npm run test:unit

  # Software-adapter browser tests (SwiftShader): correctness only, never hardware evidence. Without
  # a usable adapter the tests are reported NOT-RUN (the job does not fail for that; real test
  # failures still fail it). MTEK_REQUIRE_GPU is deliberately not set here.
  browser-software:
    name: browser-software (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # `npm run test:browser` runs `npm run build`, which builds the CLI with cargo.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --profile minimal
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests (software project)
        run: npm run test:browser -- --project=software
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-software-results
          path: tests/browser/results/
          if-no-files-found: warn
